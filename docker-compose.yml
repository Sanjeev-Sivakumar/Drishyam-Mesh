version: '3.8'

services:
  # 1. Frontend Web Client (Project Sentinel-Ledger • Drishyam Mesh)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_SENTINEL_COGNITIVE_API_KEY=${VITE_SENTINEL_COGNITIVE_API_KEY:-drishyam_cognitive_vision_default_key}
    depends_on:
      - backend
    restart: unless-stopped

  # 2. Backend Gateway (Spring Boot 3.3.5 / Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sentinel_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTHENTICATION_USERNAME=neo4j
      - NEO4J_AUTHENTICATION_PASSWORD=sentinelpassword
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/admissions/sync
    depends_on:
      - mysql
      - neo4j
      - redis
    restart: unless-stopped

  # 3. Neo4j Graph Database (Multi-Dimensional Relationship Mesh)
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/sentinelpassword
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - ./neo4j/cypher:/var/lib/neo4j/import
    restart: unless-stopped

  # 4. n8n Autonomous Workflow Orchestrator
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.25.1
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    restart: unless-stopped

  # 5. Redis (Bloom Candidate Filter for Privacy-Preserving Matching)
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 6. Relational Registry Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=sentinel_ledger
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
  neo4j_data:
  n8n_data:
  redis_data:
